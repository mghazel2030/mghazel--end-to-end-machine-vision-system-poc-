name: Validate Machine Vision PoC
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -q
      - name: Smoke run (small dataset, no training)
        run: |
          python - <<'PY'
          import yaml
          p = "config/system.yaml"
          with open(p, encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
          data["dataset"]["total_images"] = 20
          with open("config/ci.yaml", "w", encoding="utf-8") as handle:
              yaml.safe_dump(data, handle)
          PY
          python scripts/main.py --config config/ci.yaml --output results/ci_smoke --skip-training
      - uses: actions/upload-artifact@v4
        with:
          name: machine-vision-results-py${{ matrix.python-version }}
          path: results/ci_smoke/
