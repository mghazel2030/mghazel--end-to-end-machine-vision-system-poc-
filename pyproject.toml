[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "mghazel-machine-vision-poc"
version = "0.1.0"
description = "Step 1: quantitative system requirements and hardware engineering"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "matplotlib>=3.7,<4"]
[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.6,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
