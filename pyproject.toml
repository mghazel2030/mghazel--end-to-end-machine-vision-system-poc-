[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="vision-poc"
version="0.2.0"
requires-python=">=3.10,<3.14"
dependencies=["PyYAML>=6.0,<7","numpy>=1.26,<3","opencv-python-headless>=4.9,<5","matplotlib>=3.8,<4"]
[project.optional-dependencies]
dev=["pytest>=8,<10","ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
[tool.ruff]
line-length=120
target-version="py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "TRY"]
ignore = ["TRY003"]
